name: CI Pipeline

on:
  push:
    branches: [ "ci-cd", "main" ]
  pull_request:
    branches: [ "ci-cd", "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & verify Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services to initialize
        run: sleep 20

      - name: Check all containers are running
        run: |
          docker compose ps
          docker compose logs

          # Count the containers that are no longer "running"
          EXITED=$(docker compose ps --status exited -q | wc -l)
          if [ "$EXITED" -gt 0 ]; then
            echo "[KO] $EXITED container(s) have exited unexpectedly"
            exit 1
          fi
          echo "[OK] All containers are running"

      - name: Teardown
        if: always()  # clean even if the job fails
        run: docker compose down

  tests-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ cmake build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Run tests
        working-directory: backend
        run: uv run pytest . -v

  tests-database:
    name: Database service unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydatabase
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ cmake build-essential postgresql-client

      - name: Initialize database schema
        # Replace the docker-entrypoint-initdb.d of the docker-compose
        run: |
          PGPASSWORD=password psql -h localhost -U user -d mydatabase -f database/db/01_schema.sql
          PGPASSWORD=password psql -h localhost -U user -d mydatabase -f database/db/02_seed.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        working-directory: database
        run: uv sync

      - name: Start database-backend (uvicorn)
        working-directory: database
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydatabase
        run: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 &

      - name: Wait for database-backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health; then
              echo "[OK] database-backend ready"
              exit 0
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done
          echo "[KO] Timeout: database-backend did not start"
          exit 1

      - name: Run API tests
        working-directory: database
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydatabase
          SELF_URL: http://localhost:8001
        run: uv run pytest app/test_api.py -v

      - name: Run repository tests
        working-directory: database
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydatabase
        run: uv run pytest app/test_repo.py -v

  deploy:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [build, tests-backend, tests-database]  # the 3 jobs must succeed before this one runs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/evrard11/medviz-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/evrard11/medviz-frontend:latest

      - name: Build & push database-backend
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: ghcr.io/evrard11/medviz-database:latest
